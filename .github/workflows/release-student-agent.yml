name: Release Student Agent (Windows)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: student-agent/src-tauri -> target
      - name: Fmt / Clippy / Test
        working-directory: student-agent/src-tauri
        run: |
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test
      - name: Build Tauri (Windows installer)
        working-directory: student-agent
        # Signing secrets (optional): TAURI_SIGNING_PRIVATE_KEY, WINDOWS_CERTIFICATE, etc.
        # Do not hardcode secrets. Configure via GitHub Actions secrets when ready.
        run: pnpm tauri build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusmentor-windows
          path: |
            student-agent/src-tauri/target/release/bundle/nsis/*.exe
            student-agent/src-tauri/target/release/bundle/msi/*.msi
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            student-agent/src-tauri/target/release/bundle/nsis/*.exe
            student-agent/src-tauri/target/release/bundle/msi/*.msi
