name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build contracts
        run: pnpm --filter @focusmentor/contracts build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build dashboard
        run: pnpm --filter @focusmentor/dashboard build
      - name: Build backend
        run: |
          cd backend && pnpm exec prisma generate
          pnpm --filter @focusmentor/backend build
      - name: Build student-agent web
        run: pnpm --filter @focusmentor/student-agent build

  docker-backend:
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t focusmentor-api:ci .
