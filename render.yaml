services:
  - type: web
    name: focusmentor-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: focusmentor-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_MENTOR_TTL
        value: 8h
      - key: JWT_STUDENT_TTL
        value: 4h
      - key: JWT_WS_TICKET_TTL
        value: 2m
      - key: PAIRING_CODE_TTL_MINUTES
        value: 30
      - key: SUMMARY_CLEANUP_INTERVAL_MS
        value: 300000
      - key: SEED_MENTOR_EMAIL
        sync: false
      - key: SEED_MENTOR_PASSWORD
        sync: false
      - key: SEED_MENTOR_NAME
        value: Demo Mentor

databases:
  - name: focusmentor-db
    plan: starter
    postgresMajorVersion: '16'
